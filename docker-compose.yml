services:
  db:
    image: postgres:16-alpine
    container_name: mp_postgres
    environment:
      POSTGRES_USER: mp_user
      POSTGRES_PASSWORD: mp_password
      POSTGRES_DB: mercadosportugues
    ports:
      - "5432:5432"
    volumes:
      - mp_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mp_user -d mercadosportugues"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mp_pgdata:
