name: Weekly EAN Enrichment

# Enriquece EANs em falta (paginas de produto + OpenFoodFacts) e volta a ligar
# o catalogo. Semanal (domingo 05:00 UTC) porque e lento (~2-4s por oferta) e os
# EANs mudam raramente — nao pertence ao scrape diario.
#
# Usa os mesmos secrets do daily-scrape (DATABASE_URL, USE_DB=true).
# Requer PostgreSQL: em modo ficheiro nao ha de onde ler o catalogo numa
# maquina nova (o live-catalog.json nao vai para o git) — corre localmente:
#   npm run enrich:eans -- --limit=800 && npm run rematch

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximo de ofertas a enriquecer"
        required: false
        default: "800"

concurrency:
  group: weekly-enrich
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      USE_DB: ${{ secrets.USE_DB }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Validar configuracao (requer PostgreSQL)
        run: |
          if [ "$USE_DB" != "true" ]; then
            echo "::error::Secret USE_DB tem de ser exatamente \"true\". O enrich semanal corre sobre PostgreSQL (em modo ficheiro, corre localmente: npm run enrich:eans && npm run rematch)."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL em falta."
            exit 1
          fi
          npm run db:check

      - name: Enriquecer EANs
        run: npm run enrich:eans -- --limit=${{ inputs.limit || '800' }}

      - name: Resumo da execucao
        if: always()
        run: |
          echo "## Weekly enrich — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Os EANs novos entram no matching dos scrapes diarios seguintes (o sink nunca apaga EANs enriquecidos)." >> "$GITHUB_STEP_SUMMARY"
